<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>FU Study Kit</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="pp">
      <header class="pp-head">
        <h1><img src="assets/icons/icon-48.png" alt="" width="24" height="24" />FU Study Kit</h1>
        <div class="pp-head__tools">
          <button type="button" class="pp-tt__refresh pp-acct" id="acct" aria-label="Đồng bộ Google Drive" data-tip-title="" data-tip=""></button>
          <div class="pp-menu" id="acctMenu" role="menu" hidden>
            <strong class="pp-menu__name" id="acctName"></strong>
            <span class="pp-menu__email" id="acctEmail"></span>
            <p class="pp-menu__status" id="acctStatus" role="status"></p>
            <div class="pp-menu__actions">
              <button type="button" class="pp-menu__btn is-primary" id="acctSync" role="menuitem">Đồng bộ ngay</button>
              <button type="button" class="pp-menu__btn" id="logout" role="menuitem">Đăng xuất</button>
            </div>
          </div>
          <button type="button" class="pp-tt__refresh" id="theme" aria-label="Đổi giao diện sáng / tối" title="Đổi giao diện sáng / tối">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="7.5" />
              <path d="M12 4.5a7.5 7.5 0 0 1 0 15z" fill="currentColor" />
            </svg>
          </button>
        </div>
      </header>

      <section class="pp-card pp-tt" aria-label="Thời khóa biểu FAP">
        <div class="pp-card__core">
          <div class="pp-tt__head">
            <div class="pp-tt__titles">
              <span class="pp-site__name">Thời khóa biểu</span>
              <span class="pp-tt__status" id="ttStatus" role="status" hidden></span>
            </div>
            <div class="pp-tt__nav" id="ttNav" hidden>
              <button type="button" class="pp-tt__step" id="ttPrev" aria-label="Tuần trước" title="Tuần trước">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6 8.5 12l6 6" /></svg>
              </button>
              <button type="button" class="pp-tt__week" id="ttWeek" title="Về tuần này"></button>
              <button type="button" class="pp-tt__step" id="ttNext" aria-label="Tuần sau" title="Tuần sau">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6" /></svg>
              </button>
            </div>
            <a
              class="pp-tt__refresh"
              id="ttOpen"
              href="https://fap.fpt.edu.vn/WeeklyTimetable"
              target="_blank"
              rel="noopener"
              aria-label="Mở thời khóa biểu trên FAP"
              data-tip-title="Mở trên FAP"
              data-tip="Mở trang thời khóa biểu FAP trong tab mới."
              hidden
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M14 5h5v5M19 5l-8 8M17 13.5V18a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h4.5" />
              </svg>
            </a>
            <button
              type="button"
              class="pp-tt__refresh"
              id="ttRefresh"
              aria-label="Làm mới thời khóa biểu và điểm danh"
              data-tip-title="Làm mới"
              data-tip="Mở FAP trong một tab chạy nền để đọc lại lịch học và điểm danh, đọc xong tab tự đóng. Nếu FAP cần đăng nhập, tab sẽ hiện lên để bạn đăng nhập."
              hidden
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19.5 12a7.5 7.5 0 0 1-13 5.1M4.5 12a7.5 7.5 0 0 1 13-5.1M17.5 3.5v3.4h-3.4M6.5 20.5v-3.4h3.4" />
              </svg>
            </button>
          </div>
          <div class="pp-tt__body" id="ttBody"></div>
        </div>
      </section>

      <section class="pp-card" style="--i: 1" aria-label="Tiến độ ôn đề">
        <div class="pp-card__core pp-sites" id="sites"></div>
      </section>


      <p class="pp-msg" id="msg" role="status" hidden></p>

      <section class="pp-card pp-perm" id="perm" hidden>
        <div class="pp-card__core">
          <p class="pp-perm__text"><strong>Chụp câu kèm chat</strong> cần quyền chụp tab. Chỉ chụp khi bạn bấm.</p>
          <button type="button" class="pp-btn pp-btn--primary" id="grant">
            <span>Cho phép</span>
            <span class="pp-btn__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1.5-2h6l1.5 2h2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z" />
                <circle cx="12" cy="13" r="3.25" />
              </svg>
            </span>
          </button>
        </div>
      </section>

      <footer class="pp-foot">
        <nav>
          <button type="button" class="pp-foot__link" id="export">Xuất dữ liệu</button>
          <button type="button" class="pp-foot__link" id="import">Nhập dữ liệu</button>
          <input type="file" id="file" accept="application/json,.json" hidden />
          <a class="pp-foot__link" href="https://github.com/CDinhh/Extension-FU-Study-Kit/blob/main/PRIVACY.md" target="_blank" rel="noopener">Chính sách riêng tư</a>
          <a class="pp-foot__gh" href="https://github.com/CDinhh/Extension-FU-Study-Kit" target="_blank" rel="noopener" title="Mã nguồn trên GitHub">
            <img src="assets/icons/avatar.jpg" alt="" width="18" height="18" />
            <span>GitHub</span>
          </a>
          <span class="pp-foot__ver">v2.0.0</span>
        </nav>
      </footer>
    </main>

    <div class="pp-modal" id="modal" hidden>
      <div class="pp-card pp-modal__card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="pp-card__core">
          <h2 id="modalTitle">Nhập dữ liệu?</h2>
          <p class="pp-modal__lead">Dữ liệu sẽ được gộp, bản mới hơn được giữ. Không có gì bị xoá.</p>
          <ul class="pp-modal__list" id="modalList"></ul>
          <div class="pp-modal__actions">
            <button type="button" class="pp-btn pp-btn--ghost" id="modalCancel"><span>Huỷ</span></button>
            <button type="button" class="pp-btn pp-btn--primary" id="modalOk"><span>Nhập</span></button>
          </div>
        </div>
      </div>
    </div>

    <script src="lib/store-core.js"></script>
    <script src="lib/storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
